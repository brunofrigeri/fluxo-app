name: Web (studio app)

# Pull requests: typecheck, unit tests and e2e.
# Pushes to master: the same, then any new database migrations are applied to production (after a manual approval),
# and only then (if every job passed) the production deploy to Vercel.
# Vercel's own Git auto-deploy for master is switched off in vercel.json, so this workflow is the only way a release goes out.
# Migrations: see "Database migrations" in the README for the one-time setup (secrets, baseline, approval).

# Runs only when something the web app depends on changes. Landing and mobile have their own workflows.
on:
  pull_request:
    paths: &paths
      - "apps/web/**"
      - "packages/**"
      - "supabase/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".github/workflows/web.yml"
  push:
    branches: [master]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  E2E_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # the e2e runner needs Node 24.8+
          cache: npm
      - run: npm ci
      - run: npm run check:boundaries
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End-to-end tests
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # A throwaway Supabase (Postgres + Auth + API) built from supabase/migrations. Never the production project.
      - uses: supabase/setup-cli@v1
        with:
          # Pinned (the version the tests were developed against). "latest" makes the action call the GitHub API,
          # which fails with "rate limit exceeded" on shared runners.
          version: 3.1.0
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Export local Supabase connection details
        run: |
          eval "$(supabase status -o env)"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Build
        run: npx turbo run build --filter=@fluxo/web

      - name: Start the app
        working-directory: apps/web
        run: |
          nohup npm run start -- -p 3000 > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/login && exit 0
            sleep 1
          done
          echo "The app did not come up on :3000" && cat app.log && exit 1

      - name: Install the e2e browser
        working-directory: apps/web
        run: npx e2e-web install chromium --with-deps

      - name: Run e2e
        env:
          APP_URL: http://127.0.0.1:3000
          # Only needed by agent.act / agent.assert steps. Deterministic tests run without it.
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        working-directory: apps/web
        run: npx e2e run --reporter list,junit

      - name: Upload e2e report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            apps/web/.e2e/junit.xml
            apps/web/.e2e/report.json
            apps/web/.e2e/results
            apps/web/app.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------- database migrations

  migrations-dry-run:
    name: Migrations (dry run against production)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Not configured
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_PROJECT_ID == ''
        run: echo "::notice::Production database secrets are not set, so the migration dry run was skipped. See the README, 'Database migrations'."
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != ''
        with:
          version: 3.1.0
      # Read-only: it lists what would run and fails if the history does not match (a migration that was edited
      # after it ran, or one that is missing here). Nothing is changed in the database.
      - name: Show what would be applied
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != ''
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --dry-run

  migrations-changed:
    name: Migrations changed?
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"   # cannot tell: assume yes, db push is a no-op when nothing is pending
          elif git diff --name-only "$before" "${{ github.sha }}" -- supabase/migrations | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    name: Apply migrations (production)
    needs: [checks, e2e, migrations-changed]
    if: needs.migrations-changed.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The "production-database" environment (Settings > Environments) holds the approval rule: the job waits there
    # until a reviewer approves, so nothing touches the live database without a person saying so.
    environment: production-database
    # One at a time, never cancelled halfway.
    concurrency:
      group: production-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the production database secrets
        run: |
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set (README, 'Database migrations')."; missing=1; fi
          done
          exit $missing
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Link the production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Pending migrations
        run: supabase db push --dry-run
      - name: Apply
        run: supabase db push

  deploy:
    name: Deploy to Vercel (production)
    # Runs after the migrations, so the new code never meets an old schema. `migrate` is skipped when no migration changed.
    needs: [checks, e2e, migrations-changed, migrate]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
      && needs.checks.result == 'success' && needs.e2e.result == 'success' && needs.migrations-changed.result == 'success'
      && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Never cancel a deploy halfway; later pushes queue behind it.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Vercel builds the app itself (not `vercel pull` + `vercel build` here): variables marked Sensitive in Vercel
      # cannot be pulled, they come down as the text "[SENSITIVE]" and get baked into the build, which broke the middleware.
      - name: Deploy (Vercel builds it with the project's own environment variables)
        run: npx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
